name: Build ABTalks V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make setup script executable
        run: chmod +x setup.sh

      - name: Generate ABTalks project
        run: ./setup.sh

      - name: Install dependencies
        working-directory: abtalks-v2
        run: npm install

      - name: Build project
        working-directory: abtalks-v2
        run: npm run build

      - name: Save generated project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abtalks-v2
          git commit -m "Add ABTalks V2 Step 1 project" || echo "Nothing to commit"
          git push
